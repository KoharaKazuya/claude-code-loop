name: Release devcontainer feature

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  packages: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle lib/, bin/ and package.json into the feature
        # Tests aren't part of the distributed tool, so exclude *.test.ts and the vitest
        # setup file from the copy.
        run: |
          rsync -a --exclude='*.test.ts' --exclude='test-setup.ts' lib/ features/ccloop/lib/
          cp -R bin features/ccloop/bin
          cp package.json features/ccloop/package.json

      - name: Verify tag, feature and package versions all match
        # scripts/check-version.mjs はルートの package.json / features/ccloop/devcontainer-feature.json に
        # 加えて README.md の ccloop feature 参照バージョンも検査する(前段の Bundle ステップで
        # features/ccloop/package.json がコピーされるが、これはルートの package.json とは無関係)。
        if: github.ref_type == 'tag'
        run: node scripts/check-version.mjs --expect "${GITHUB_REF_NAME#v}"

      - name: Publish feature
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./features"
          generate-docs: "false"
        # devcontainer CLI は ghcr.io への push 認証に GITHUB_TOKEN 環境変数を使う。
        # action 側は自動で渡さないため、明示しないと匿名 push になり失敗する。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
