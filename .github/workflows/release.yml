name: Release devcontainer feature

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  packages: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle lib/ and bin/ into the feature
        run: |
          cp -R lib features/ccloop/lib
          cp -R bin features/ccloop/bin

      - name: Verify feature version matches tag
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          feature_version="$(node -e "console.log(require('./features/ccloop/devcontainer-feature.json').version)")"
          if [ "${tag_version}" != "${feature_version}" ]; then
            echo "error: tag version (${tag_version}) does not match features/ccloop/devcontainer-feature.json version (${feature_version})" >&2
            exit 1
          fi
          echo "version OK: ${feature_version}"

      - name: Publish feature
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./features"
          generate-docs: "false"
